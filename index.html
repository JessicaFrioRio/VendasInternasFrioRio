<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acesso de colaboradores | FrioRio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="travado">
  <header class="header">
    <div class="container">
      <a href="/" class="marca">
        <img src="/logo.png" alt="FrioRio">
        <span>Programa de vendas exclusivo<br>para colaboradores FrioRio</span>
      </a>
      <nav class="menu" aria-label="Acesso"></nav>
    </div>
  </header>

  <section class="trava" aria-labelledby="titulo-acesso">
    <div class="trava-caixa">
      <h1 id="titulo-acesso">Acesso exclusivo para colaboradores</h1>
      <p>Digite seu código de acesso.</p>
      <label for="codigo">Código de acesso</label>
      <input id="codigo" type="text" inputmode="text" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Ex.: A1B2C3D">
      <p class="trava-erro" role="alert" hidden></p>
      <button class="botao" type="button">Entrar</button>
    </div>
  </section>

  <noscript><p class="container">Ative o JavaScript para entrar com seu código de acesso.</p></noscript>
  <script src="/acesso.js?v=3" defer></script>
</body>
</html>
